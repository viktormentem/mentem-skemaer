<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ESS udgave C · klientvenlig ramme (IKKE klientvendt)</title>
<!--
  UDGAVE C , den klientvenlige, og hele dens pointe er HVOR venligheden bor.

  🔴 TO LAG PAA SAMME SKAERM, OG KUN DET ENE ER MAPIS.
  Husets egen licensvurdering (ESS-licens-vurdering-2026-06-26.md l.38), ordret:
    "Vores ESS-milepaels-wrapper er vores EGEN ramme og er IKKE licens-bundet; den kan vises
     frit. KUN de 8 ESS-items + skala + scoring er licens-bundne."
  ⇒ Alt hvad der goer skaermen venlig , velkomst, fremdrift, knapper, kvittering , er VORES
  og kraever ingens samtykke. Alt inde i instrumentet er Mapis og roeres ikke.

  🔵 Derfor er C den udgave der har stoerst chance for at blive godkendt: der er ingenting i
  Mapis lag at sige nej til. Ordlyden er byte-identisk med udgave A og B (samme kilde-modul).
  Forskellen er udelukkende at VORES lag goer arbejdet.

  🔴 DENNE FIL ER IKKE KLIENTVENDT. `ess` er KLAR:false og staar ikke paa OFFENTLIGT_KLAR.
  Filen ligger i en undermappe og kan strukturelt ikke udrulles (deploy kopierer kun rod-filer).
-->
<style>
  body { margin: 0; }
  #review-ramme {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1d2b36; color: #eef4f8; padding: 14px 18px;
    display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap;
  }
  #review-ramme b { color: #ffd479; }
  #review-ramme button {
    font: inherit; padding: 7px 14px; border-radius: 7px; border: 1px solid #7fa8c4;
    background: #2b3f4f; color: #eef4f8; cursor: pointer; white-space: nowrap;
  }
  body.rent #review-ramme { display: none; }
  #skaerm { max-width: 620px; margin: 0 auto; padding: 28px 18px 60px; }

  /* ── VORES lag. Fri form, ingen licens. ─────────────────────────────── */
  .hus-fremdrift { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .hus-bar { flex: 1; height: 6px; border-radius: 3px; background: #e3e0d8; overflow: hidden; }
  .hus-bar > i { display: block; height: 100%; background: #2f6f5a; transition: width .25s; }
  .hus-tal { font: 13px/1 -apple-system, sans-serif; color: #6b6a63; white-space: nowrap; }
  .hus-knapper { display: flex; gap: 10px; margin-top: 26px; }
  .hus-knap {
    font: 15px/1 -apple-system, sans-serif; padding: 12px 20px; border-radius: 9px;
    border: 1px solid #c9c5ba; background: #fff; cursor: pointer;
  }
  .hus-knap[disabled] { opacity: .4; cursor: default; }
  .hus-venlig { font: 15px/1.55 -apple-system, sans-serif; color: #4a4943; margin: 0 0 20px; }
</style>
</head>
<body>

<div id="review-ramme">
  <div style="flex:1 1 380px">
    <b>ESS · UDGAVE C (klientvenlig ramme).</b> Ét spørgsmål ad gangen, fremdrift og en varm
    indledning. <b>Alt det er VORES lag</b> og er ikke licensbundet. Instrumentets ordlyd,
    skala og rækkefølge er byte-identiske med udgave A og B.
  </div>
  <button id="toggle" type="button">Skjul denne ramme</button>
</div>

<div id="skaerm">
  <!-- VORES lag -->
  <div class="hus-fremdrift">
    <div class="hus-bar"><i id="bar" style="width:12.5%"></i></div>
    <span class="hus-tal" id="tal">1 af 8</span>
  </div>
  <p class="hus-venlig" id="venlig"></p>

  <!-- MAPIS lag , uændret -->
  <h1 id="instrument-title" class="diary-title"></h1>
  <p id="instrument-intro" class="diary-intro" style="white-space:pre-line"></p>
  <div id="instrument-fields"></div>
  <p id="instrument-attribution" style="margin-top:26px;font-size:13px"></p>

  <!-- VORES lag -->
  <div class="hus-knapper">
    <button class="hus-knap" id="forrige" type="button" disabled>Tilbage</button>
    <button class="hus-knap" id="naeste" type="button">Næste</button>
  </div>
</div>

<script type="module">
import { ESS_INSTRUMENT_SLOT as ESS } from '../mentem-skema-core.js';

try {
  const html = await (await fetch('../index.html')).text();
  const m = html.match(/<style>([\s\S]*?)<\/style>/);
  if (!m || !m[1].includes('.radio-option')) throw new Error('style-blokken mangler .radio-option');
  const st = document.createElement('style'); st.textContent = m[1]; document.head.appendChild(st);
} catch (e) {
  document.getElementById('skaerm').innerHTML =
    '<p style="font:16px sans-serif;color:#b00">UMÅLT: kunne ikke hente klientfladens styles ('
    + e.message + '). Skyd IKKE screenshots af denne side.</p>';
  throw e;
}

const esc = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 🔵 VORES tekst. Den er husets egen og maa skrives frit , den er ikke en del af ESS.
document.getElementById('venlig').textContent =
  'Otte korte spørgsmål om, hvor let du falder i søvn i hverdagssituationer. '
  + 'Der er ingen rigtige eller forkerte svar, og det tager omkring to minutter.';

// MAPIS lag , uændret ordlyd, uændret rækkefølge, uændret skala.
document.getElementById('instrument-title').textContent = ESS.uiTitle;
document.getElementById('instrument-intro').textContent = ESS.instruktion;
document.getElementById('instrument-attribution').textContent = ESS.attribution;

const wrap = document.getElementById('instrument-fields');
let aktiv = 0;

// 🔴 TRIN 0 ER INTRO. Foerste udgave af C gentog hele instruktionen paa alle otte skaermene,
// saa selve spoergsmaalet laa under folden , altsaa VAERRE end udgave A, ikke bedre.
// Kilden viser ogsaa instruktionen EEN gang, saa pagineringen er baade venligere OG taettere
// paa originalen. Intet er fjernet; det er fordelt.
const TRIN = ESS.scoredItems.length;   // 0 = intro, 1..TRIN = spoergsmaal
function tegn() {
  wrap.innerHTML = '';
  const erIntro = aktiv === 0;
  document.getElementById('instrument-intro').style.display = erIntro ? '' : 'none';
  document.getElementById('instrument-title').style.display = erIntro ? '' : 'none';
  document.getElementById('venlig').style.display = erIntro ? '' : 'none';
  if (erIntro) {
    document.getElementById('tal').textContent = 'Introduktion';
    document.getElementById('bar').style.width = '0%';
    document.getElementById('forrige').disabled = true;
    document.getElementById('naeste').textContent = 'Start';
    return;
  }
  const item = ESS.scoredItems[aktiv - 1];

  const ph = document.createElement('p');
  ph.className = 'instrument-stem';
  ph.textContent = ESS.stem;
  wrap.appendChild(ph);

  const fs = document.createElement('fieldset');
  fs.className = 'diary-field instrument-field';
  const legend = document.createElement('legend');
  legend.className = 'diary-q';
  legend.innerHTML = `<span class="question-num" aria-hidden="true">${aktiv}.</span>` + esc(item.text);
  fs.appendChild(legend);

  const group = document.createElement('div');
  group.className = 'radio-group';
  group.setAttribute('role', 'radiogroup');
  group.setAttribute('aria-label', ESS.stem + ' ' + item.text);
  for (const opt of ESS.options) {
    const lbl = document.createElement('label');
    lbl.className = 'radio-option';
    lbl.innerHTML = `<input type="radio" name="${esc(item.key)}" value="${opt.value}">`
                  + `<span>${opt.value} = ${esc(opt.label)}</span>`;
    group.appendChild(lbl);
  }
  fs.appendChild(group);
  wrap.appendChild(fs);

  document.getElementById('tal').textContent = `${aktiv} af ${TRIN}`;
  document.getElementById('bar').style.width = `${aktiv / TRIN * 100}%`;
  document.getElementById('forrige').disabled = false;
  document.getElementById('naeste').textContent = aktiv === TRIN ? 'Færdig' : 'Næste';
}

document.getElementById('naeste').addEventListener('click', () => {
  if (aktiv < TRIN) { aktiv++; tegn(); }
});
document.getElementById('forrige').addEventListener('click', () => {
  if (aktiv > 0) { aktiv--; tegn(); }
});
document.getElementById('toggle').addEventListener('click', () => document.body.classList.add('rent'));
if (new URLSearchParams(location.search).get('rent') === '1') document.body.classList.add('rent');
// Saem til screenshot-produktion: ?item=3 aabner paa et bestemt spoergsmaal.
const oensket = parseInt(new URLSearchParams(location.search).get('item') || '0', 10);
if (oensket >= 0 && oensket <= ESS.scoredItems.length) aktiv = oensket;
tegn();
</script>
</body>
</html>
